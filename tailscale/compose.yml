# ==============================================================================
# Stack: Tailscale Subnet Router (tailscale/compose.yml)
#
# Purpose:
#   Connects the homelab to the Tailscale mesh network and acts as a subnet
#   router advertising 192.168.0.0/24 so remote WireGuard peers (phones, laptops)
#   can reach internal services and LAN devices directly.
#
# Network Topology:
#   Dual-homed across two Docker networks:
#     1. 'external_npm' (macvlan on eth0): Assigns Tailscale its own dedicated
#        LAN IP (192.168.0.5) so it can reach the physical LAN gateway
#        (192.168.0.1), Pi-hole (192.168.0.2), the NAS host OS (192.168.0.3),
#        and critically, Nginx Proxy Manager (192.168.0.4) without being
#        blocked by Linux kernel macvlan-to-host isolation rules.
#     2. 'homelab' (internal bridge on 192.168.255.0/24): Connects Tailscale
#        directly to internal backend containers.
# ==============================================================================

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homelab
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=homelab
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=192.168.0.0/24
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---snat-subnet-routes=true --accept-dns=false}
    volumes:
      - ${DOCKER_DATA_DIR:-/volume1/docker}/tailscale/data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    networks:
      homelab:
      external_npm:
        ipv4_address: ${TAILSCALE_IPV4_ADDRESS:-192.168.0.5}

networks:
  homelab:
    external: true
  external_npm:
    external: true
