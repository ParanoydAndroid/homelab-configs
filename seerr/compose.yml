# ==============================================================================
# Stack: Seerr Media Request Management (seerr/compose.yml)
#
# Purpose:
#   Provides media discovery, user request workflows, and integration with
#   Jellyfin, Radarr, and Sonarr (https://seerr.turing.home) via Nginx Proxy Manager.
#
# Process & Lifecycle Note:
#   - 'ghcr.io/seerr-team/seerr:latest' runs rootless as non-privileged UID 1000
#     (node) internally. Do NOT set PUID/PGID environment variables.
#   - 'init: true' invokes Docker's embedded tini init process to safely reap
#     orphaned zombie processes and manage signal delivery to Node.js.
# ==============================================================================

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    hostname: seerr
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:?See env.example for default.}
      API_KEY: ${SEERR_API_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/seerr/data:/app/config
    # ports:
    #   - 5055:5055
    networks:
      - homelab
    labels:
      - homepage.group=Media Requests
      - homepage.name=Seerr
      - homepage.icon=seerr
      - homepage.href=https://seerr.turing.home
      - homepage.description=Media Requests
      - homepage.widget.type=overseerr
      - homepage.widget.url=http://seerr:5055
      - homepage.widget.key=${SEERR_API_KEY:?See env.example for default.}

networks:
  homelab:
    external: true

