# ==============================================================================
# Stack: qBittorrentVPN (qbittorrentvpn/compose.yml)
#
# Purpose:
#   BitTorrent client bound to an OpenVPN tunnel (Private Internet Access) with
#   an iptables kill switch and automated PIA port forwarding.
#
# UID/GID & Entrypoint Note:
#   Uses 'PUID' and 'PGID' environment variables (1000:100). Do NOT set Compose
#   'user:' on this container because the binhex init entrypoint must start as
#   root to configure the tun0 interface, OpenVPN, and iptables rules before
#   dropping privileges to PUID:PGID for the qbittorrent-nox process.
# ==============================================================================

services:
  qbittorrentvpn:
    # Image pinned to 4.3.3-1-02: newer builds require a host kernel > 4.4 / WireGuard netlink support
    image: binhex/arch-qbittorrentvpn:4.3.3-1-02
    container_name: qbittorrentvpn
    hostname: qbittorrentvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      DEBUG: "true"
      WEBUI_PORT: 8081
      VPN_ENABLED: "yes"
      VPN_PROV: pia
      VPN_CLIENT: openvpn
      VPN_USER: ${VPN_USER}
      VPN_PASS: ${VPN_PASS}
      STRICT_PORT_FORWARD: "yes"
      ENABLE_PRIVOXY: "no"
      ENABLE_SOCKS: "no"
      NAME_SERVERS: 9.9.9.10,149.112.112.10
      LAN_NETWORK: 192.168.0.0/16
      PUID: ${PUID:-1000}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ${DOCKER_DATA_DIR:-/volume1/docker}/qbittorrentvpn/data/config:/config
      # Custom PIA port-forwarding script override (fixes legacy hardcoded 10.0.0.1 gateway lookup)
      - ${DOCKER_DATA_DIR:-/volume1/docker}/qbittorrentvpn/data/getvpnport.sh:/root/getvpnport.sh
      - ${MEDIA_DIR:-/volume1/media}:/media
    ports:
      # WebUI (8081) is reverse-proxied via NPM at https://torrent.turing.home.
      # Peer traffic ports (58946 TCP/UDP) remain bound as required by the container.
      # - 8081:8081
      - 58946:58946
      - 58946:58946/udp
    networks:
      - homelab
    logging:
      options:
        max-size: "1m"
        max-file: "3"
    labels:
      - homepage.group=Downloads
      - homepage.name=QBittorrentVPN
      - homepage.icon=qbittorrent
      - homepage.href=http://torrent.turing.home
      - homepage.description=New Torrent client with attached VPN kill switch.
      - homepage.widget.type=qbittorrent
      - homepage.widget.url=http://qbittorrentvpn:8081
      - homepage.widget.username=admin
      - homepage.widget.password=${QBITTORRENT_WIDGET_PASSWORD}

networks:
  homelab:
    external: true
