# ==============================================================================
# Stack: Tandoor Recipes (tandoor/compose.yml)
#
# Purpose:
#   Recipe management application accessible on the LAN (https://recipes.turing.home)
#   and externally (https://recipes.kamaka.tech) via Nginx Proxy Manager, backed
#   by the 'postgresql' container on the 'homelab' bridge network.
#
# UID/GID & Media Serving Note:
#   - Tandoor's entrypoint ('boot.sh') starts as root and drops privileges to
#     PUID:PGID (1000:100) via su-exec. Do NOT set Compose 'user:'.
#   - Uploaded recipe images in '${DOCKER_DATA_DIR}/tandoor/data/mediafiles' are
#     also bind-mounted read-only into the 'nginx' container at '/media:ro' so
#     Nginx Proxy Manager serves '/media/' requests directly in production.
# ==============================================================================

services:
  tandoor:
    image: vabene1111/recipes
    container_name: tandoor
    hostname: tandoor
    restart: unless-stopped
    environment:
      PUID: ${PUID:?PUID is required (see .env.example for defaults)}
      PGID: ${PGID:?PGID is required (see .env.example for defaults)}
      TZ: ${TZ:?TZ is required (see .env.example for defaults)}
      # Random cryptographic secret key (populated in tandoor/.env)
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (see .env.example for defaults)}
      # Restrict allowed HTTP Host headers to configured external, LAN, and internal domains
      ALLOWED_HOSTS: recipes.kamaka.tech,recipes.turing.home,tandoor,localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:password@postgresql:5432/recipes
      TANDOOR_PORT: 8050
    volumes:
      - ${DOCKER_DATA_DIR:?DOCKER_DATA_DIR is required (see .env.example for defaults)}/tandoor/data/staticfiles:/opt/recipes/staticfiles
      - ${DOCKER_DATA_DIR:?DOCKER_DATA_DIR is required (see .env.example for defaults)}/tandoor/data/mediafiles:/opt/recipes/mediafiles
    # ports:
    #   - 8050:8050
    networks:
      - homelab

networks:
  homelab:
    external: true
