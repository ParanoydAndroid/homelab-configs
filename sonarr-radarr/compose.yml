services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1027
      - PGID=100
      - TZ=America/New_York
    volumes:
      - /volume1/docker/radarr/data/radarr_config:/config
      - /volume1/Public:/media
    ports:
      - 8040:7878
    networks:
      - homelab
    labels:
      - homepage.group=Downloads
      - homepage.name=Radarr
      - homepage.icon=radarr
      - homepage.href=http://radarr.turing.home
      - homepage.description="Movie Autodownloader"
      - homepage.widget.type=radarr
      - homepage.widget.url=http://radarr:7878
      - homepage.widget.key=76a219a9f0b045ca98a6cbfe20369392
      - homepage.widget.enableQueue=true
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1027
      - PGID=100
      - TZ=America/New_York
    volumes:
      - /volume1/docker/radarr/data/sonarr_config:/config
      - /volume1/Public:/media
    ports:
      - 8041:8989
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - homepage.group=Downloads
      - homepage.name=Sonarr
      - homepage.icon=sonarr
      - homepage.href=http://sonarr.turing.home
      - homepage.description="TV Autodownloader"
      - homepage.widget.type=sonarr
      - homepage.widget.url=http://sonarr:8989
      - homepage.widget.key=41810866b1d241d1aed315736f476f1f
      - homepage.widget.enableQueue=true
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1027
      - PGID=100
      - TZ=America/New_York
    volumes:
      - /volume1/docker/radarr/data/prowlerr_config:/config
    ports:
      - 8042:9696
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr
      - homepage.href=http://prowlarr.turing.home
      - homepage.description="Indexer Management"
      - homepage.widget.type=prowlarr
      - homepage.widget.url=http://prowlarr:9696
      - homepage.widget.key=f9a0b622f4244507a3d866f0a546d416
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=America/New_York
    ports:
      - 8043:8191
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Flaresolverr
      - homepage.icon=flaresolverr
      - homepage.href=http://flaresolverr.turing.home
      - homepage.description="Cloudflare Bypass (degraded)"

networks:
  homelab:
    external: true
