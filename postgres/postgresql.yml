services:
  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    restart: unless-stopped
    volumes:
      - /volume1/docker/postgresql/data:/var/lib/postgresql/data
    environment:
      # POSTGRES_USER: postgres  # this is already the system default
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recipes
    networks:
      - homelab

networks:
  homelab:
    external: true
