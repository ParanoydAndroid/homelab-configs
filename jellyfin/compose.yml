# ==============================================================================
# Stack: Jellyfin Media Server (jellyfin/compose.yml)
#
# Purpose:
#   Serves local media across the LAN (https://jellyfin.turing.home) and
#   externally (https://jellyfin.kamaka.tech) via Nginx Proxy Manager.
#
# Security Hardening (External Exposure):
#   - Official 'jellyfin/jellyfin' image does NOT drop privileges via PUID/PGID
#     container process to run as non-root via PUID/PGID.
#   - Drops all Linux kernel capabilities ('cap_drop: [ALL]') and blocks
#     privilege escalation ('no-new-privileges:true').
#   - Mounts the shared media library read-only (':ro') so a compromised media
#     server process cannot modify or delete media files on /volume1/media.
# ==============================================================================

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    user: "${PUID:?See env.example for default.}:${PGID:?See env.example for default.}"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Expose Intel iGPU render node for Quick Sync hardware transcoding
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # Map host render group (GID 105) into the non-root container process for /dev/dri access
    group_add:
      - "105"
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      UMASK: "022"
      TZ: ${TZ:?See env.example for default.}
      JELLYFIN_PublishedServerUrl: http://jellyfin:8096
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/jellyfin/data/config:/config
      - ${MEDIA_DIR:?See env.example for default.}:/data/media:ro
    tmpfs:
      - /transcode:size=4G,mode=1777
    ports:
      # HTTP/HTTPS traffic is reverse-proxied via NPM on the 'homelab' network.
      # Only UDP port 8022->7359 is bound on the host for LAN client auto-discovery.
      # - 8020:8096/tcp # http
      # - 8021:8920/tcp # https
      - 8022:7359/udp # autodiscovery
    networks:
      - homelab
    labels:
      - homepage.group=Players
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin
      - homepage.href=http://jellyfin.turing.home
      - homepage.description=Open source media server. Hosts local movies, shows, music, and ebooks.
      - homepage.widget.type=jellyfin
      - homepage.widget.version=2
      - homepage.widget.url=http://jellyfin:8096
      - homepage.widget.key=${JELLYFIN_API_KEY:?See env.example for default.}

networks:
  homelab:
    external: true
