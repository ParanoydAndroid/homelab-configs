services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    environment:
      PUID: 1000
      GUID: 100
      UMASK: 22
      TZ: America/New_York
      JELLYFIN_PublishedServerUrl: http://jellyfin:8096
    volumes:
      - /volume1/docker/jellyfin/data/config:/config
      - /volume1/media:/data/media
    ports:
      - ${PORT_EXTERNAL_HTTP}:8096/tcp # http
      - ${PORT_EXTERNAL_HTTPS}:8920/tcp # https
      - 8022:7359/udp # autodiscovery
    # Expose Intel iGPU render node for Quick Sync hardware transcoding
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # Map host render group (105) permissions into container to prevent permission denied errors
    group_add:
      - "105"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    labels:
      - homepage.group=Players
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin
      - homepage.href=http://jellyfin.turing.home
      - homepage.description="Open source media server.  Hosts local movies,
        shows, music, and ebooks."
      - homepage.widget.type=jellyfin
      - homepage.widget.url=http://jellyfin:8096
      - homepage.widget.key=${WIDGET_KEY}
    networks:
      - homelab
networks:
  homelab:
    external: true
