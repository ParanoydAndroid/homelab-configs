# ==============================================================================
# Stack: Homepage Dashboard (dashboard/compose.yml)
#
# Purpose:
#   Serves the homelab application dashboard at https://homepage.turing.home.
#   Queries /var/run/docker.sock to auto-discover container status and reads
#   'homepage.*' Docker labels defined across all stacks.
# ==============================================================================

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    hostname: homepage
    restart: unless-stopped
    privileged: true
    environment:
      PUID: 0
      PGID: 0
      UMASK: "022"
      TZ: ${TZ:?See env.example for default.}
      HOMEPAGE_ALLOWED_HOSTS: homepage.kamaka.tech,kamaka.tech,homepage.turing.home,www.turing.home,turing.home,192.168.0.4
      HOMEPAGE_VAR_PIHOLE_KEY: ${HOMEPAGE_VAR_PIHOLE_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/homepage/data:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MEDIA_DIR:?See env.example for default.}:/volume1:ro
      - ${DOCKER_DATA_DIR:?See env.example for default.}:/volume2:ro
    networks:
      - homelab
    labels:
      - caddy=homepage.kamaka.tech, kamaka.tech
      - caddy.reverse_proxy={{upstreams 3000}}
      - caddy.import=cloudflare_tls
      - homepage.group=Administration
      - homepage.name=Homepage
      - homepage.icon=homepage
      - homepage.href=https://homepage.kamaka.tech
      - homepage.description=Homelab Dashboard

networks:
  homelab:
    external: true
