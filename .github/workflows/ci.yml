name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Conventions and Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Conventions Test Suite
        run: ./.harness/test-runner.sh conventions

      - name: Run Codebase Drift Audit
        run: ./manage.sh audit
