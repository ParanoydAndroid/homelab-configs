# ==============================================================================
# Stack: Media Streaming, Automation & Indexing (media/compose.yml)
#
# Purpose:
#   Integrated media pipeline:
#     - jellyfin: Local media streaming server with hardware transcoding (QuickSync).
#     - seerr: User discovery, request management, and media approval portal.
#     - sonarr: TV series tracking and automated download management.
#     - radarr: Movie tracking and automated download management.
#     - prowlarr: Unified indexer manager syncing indexers to Sonarr and Radarr.
#     - flaresolverr: Proxy for bypassing Cloudflare anti-bot challenges on indexers.
# ==============================================================================

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    user: "${PUID:?See env.example for default.}:${PGID:?See env.example for default.}"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      - ${DRI_RENDER_DEVICE:?See env.example for default.}:/dev/dri/renderD128
    group_add:
      - "105"
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      UMASK: "022"
      TZ: ${TZ:?See env.example for default.}
      JELLYFIN_PublishedServerUrl: http://jellyfin:8096
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/jellyfin/data/config:/config
      - ${MEDIA_DIR:?See env.example for default.}:/data/media:ro
    tmpfs:
      - /transcode:size=4G,mode=1777
    ports:
      - 8022:7359/udp
    networks:
      - homelab
    labels:
      - homelab.stack.priority=30
      - homelab.backup.sqlite=/config/data/jellyfin.db
      - caddy=jellyfin.kamaka.tech, jellyfin.kamakakai.com, media.kamaka.tech, media.kamakakai.com
      - caddy.reverse_proxy={{upstreams 8096}}
      - caddy.import=cloudflare_tls jellyfin_hardening
      - homepage.group=Players
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin
      - homepage.href=https://jellyfin.kamaka.tech
      - homepage.description=Media Server
      - homepage.widget.type=jellyfin
      - homepage.widget.version=2
      - homepage.widget.url=http://jellyfin:8096
      - homepage.widget.key=${JELLYFIN_API_KEY:?See env.example for default.}

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    hostname: seerr
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: debug
      TZ: ${TZ:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/seerr/data:/app/config
    networks:
      - homelab
    labels:
      - caddy=seerr.kamaka.tech
      - caddy.reverse_proxy={{upstreams 5055}}
      - caddy.import=cloudflare_tls
      - homepage.group=Media Requests
      - homepage.name=Seerr
      - homepage.icon=seerr
      - homepage.href=https://seerr.kamaka.tech
      - homepage.description=Media Requests
      - homepage.widget.type=overseerr
      - homepage.widget.url=http://seerr:5055
      - homepage.widget.key=${SEERR_API_KEY:?See env.example for default.}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/radarr/data:/config
      - ${MEDIA_DIR:?See env.example for default.}:/media
    networks:
      - homelab
    labels:
      - homelab.backup.sqlite=/config/radarr.db
      - caddy=radarr.kamaka.tech
      - caddy.reverse_proxy={{upstreams 7878}}
      - caddy.import=cloudflare_tls
      - homepage.group=Downloads
      - homepage.name=Radarr
      - homepage.icon=radarr
      - homepage.href=https://radarr.kamaka.tech
      - homepage.description=Movie Automation
      - homepage.widget.type=radarr
      - homepage.widget.url=http://radarr:7878
      - homepage.widget.key=${RADARR_API_KEY:?See env.example for default.}
      - homepage.widget.enableQueue=true

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/sonarr/data:/config
      - ${MEDIA_DIR:?See env.example for default.}:/media
    networks:
      - homelab
    labels:
      - homelab.backup.sqlite=/config/sonarr.db
      - caddy=sonarr.kamaka.tech
      - caddy.reverse_proxy={{upstreams 8989}}
      - caddy.import=cloudflare_tls
      - homepage.group=Downloads
      - homepage.name=Sonarr
      - homepage.icon=sonarr
      - homepage.href=https://sonarr.kamaka.tech
      - homepage.description=TV Automation
      - homepage.widget.type=sonarr
      - homepage.widget.url=http://sonarr:8989
      - homepage.widget.key=${SONARR_API_KEY:?See env.example for default.}
      - homepage.widget.enableQueue=true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/prowlarr/data:/config
    networks:
      - homelab
    labels:
      - homelab.backup.sqlite=/config/prowlarr.db
      - caddy=prowlarr.kamaka.tech
      - caddy.reverse_proxy={{upstreams 9696}}
      - caddy.import=cloudflare_tls
      - homepage.group=Infrastructure
      - homepage.name=Prowlarr
      - homepage.icon=prowlarr
      - homepage.href=https://prowlarr.kamaka.tech
      - homepage.description=Indexer Management
      - homepage.widget.type=prowlarr
      - homepage.widget.url=http://prowlarr:9696
      - homepage.widget.key=${PROWLARR_API_KEY:?See env.example for default.}

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ:?See env.example for default.}
    networks:
      - homelab
    labels:
      - caddy=flaresolverr.kamaka.tech
      - caddy.reverse_proxy={{upstreams 8191}}
      - caddy.import=cloudflare_tls
      - homepage.group=Infrastructure
      - homepage.name=Flaresolverr
      - homepage.icon=flaresolverr
      - homepage.href=https://flaresolverr.kamaka.tech
      - homepage.description=Cloudflare Solver

networks:
  homelab:
    external: true
