# ------------------------------------------------------------
# seerr.turing.home
# ------------------------------------------------------------


map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "seerr";
  set $port           5055;

  listen 80;
#listen [::]:80;

listen 443 ssl;
#listen [::]:443;


  server_name seerr.turing.home;

  http2 on;


  # Custom SSL
  ssl_certificate /data/custom_ssl/npm-7/fullchain.pem;
  ssl_certificate_key /data/custom_ssl/npm-7/privkey.pem;













  # Proxy!
  include conf.d/include/force-ssl.conf;

  # Restrict to local/homelab network
  allow 192.168.0.0/16;
  allow 127.0.0.1;
  deny all;

  access_log /data/logs/proxy-host-14_access.log proxy;
  error_log /data/logs/proxy-host-14_error.log warn;





  location / {






    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;


    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
