# ------------------------------------------------------------
# jellyfin.turing.home
# ------------------------------------------------------------



map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "jellyfin";
  set $port           8096;

  listen 80;
#listen [::]:80;

listen 443 ssl;
#listen [::]:443;


  server_name jellyfin.turing.home;

  http2 on;


  # Custom SSL
  ssl_certificate /data/custom_ssl/npm-7/fullchain.pem;
  ssl_certificate_key /data/custom_ssl/npm-7/privkey.pem;














  access_log /data/logs/proxy-host-4_access.log proxy;
  error_log /data/logs/proxy-host-4_error.log warn;







  location / {







    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

