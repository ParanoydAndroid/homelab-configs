# ==============================================================================
# Homepage Dashboard Static Service Definitions (.configs/homepage/services.yaml)
#
# Note:
#   Containerized services on the 'homelab' Docker network are discovered
#   automatically via 'homepage.*' labels in each stack's compose.yml.
#   This file defines external/host appliances (Pi-hole, NAS DSM) and combined
#   media calendar widgets.
# ==============================================================================

- Services:
    - Administration:
        - Pi-Hole:
            icon: pi-hole
            href: http://pi.hole/admin
            description: DNS Server and Adblocker.
            widget:
              type: pihole
              version: 6
              url: http://pi.hole
              key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
        - DSM:
            icon: synology-dsm
            href: https://nas.home
            description: UGREEN NAS host management interface.
    - Media:
        - Calendar:
            - Calendar:
                widget:
                    type: calendar
                    firstDayInWeek: sunday
                    integrations:
                        - type: sonarr
                          service_group: Downloads
                          service_name: Sonarr
                          color: purple
                        - type: radarr
                          service_group: Downloads
                          service_name: Radarr
                          color: violet
