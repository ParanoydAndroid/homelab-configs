# ==============================================================================
# Stack: Ingress & Reverse Proxy (ingress/compose.yml)
#
# Purpose:
#   Ingress reverse proxy and automated Let's Encrypt wildcard SSL termination
#   for internal LAN subdomains (*.kamaka.tech) and public internet subdomains
#   (*.kamakakai.com) via Caddy Docker Proxy and Cloudflare Zero Trust Tunnel.
#
# Services:
#   - caddy: Dual-homed on 'external_npm' macvlan (192.168.0.4) and 'homelab' bridge.
#   - cloudflared: Outbound encrypted CGNAT ingress tunnel on 'homelab' bridge.
# ==============================================================================

services:
  caddy:
    build: .
    image: homelab-caddy:latest
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    command: caddy docker-proxy --caddyfile-path /etc/caddy/Caddyfile
    mac_address: 2E:50:8F:7A:C4:12
    environment:
      TZ: ${TZ:?See env.example for default.}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?See env.example for default.}
      CADDY_INGRESS_NETWORKS: homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DATA_DIR:?See env.example for default.}/caddy/data:/data
      - ${DOCKER_DATA_DIR:?See env.example for default.}/caddy/config:/config
      - ${DOCKER_DATA_DIR:?See env.example for default.}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      homelab:
        aliases:
          - services
      external_npm:
        ipv4_address: ${NPM_IPV4_ADDRESS:?See env.example for default.}
    labels:
      - homepage.group=Administration
      - homepage.name=Caddy Proxy
      - homepage.icon=caddy
      - homepage.href=https://nas.kamaka.tech
      - homepage.description=Reverse Proxy & Automated SSL

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    hostname: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?See env.example for default.}
    networks:
      - homelab
    labels:
      - homepage.group=Network
      - homepage.name=Cloudflare Tunnel
      - homepage.icon=cloudflare
      - homepage.href=https://one.dash.cloudflare.com/
      - homepage.description=Zero Trust Tunnel

networks:
  external_npm:
    external: true
  homelab:
    external: true
