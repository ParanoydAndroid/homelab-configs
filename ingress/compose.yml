# ==============================================================================
# Stack: Ingress & Reverse Proxy (ingress/compose.yml)
#
# Purpose:
#   Ingress reverse proxy and SSL termination point for internal LAN subdomains
#   (*.turing.home) and external internet subdomains (*.kamaka.tech) via Cloudflare
#   Zero Trust Tunnel.
#
# Services:
#   - nginx: Dual-homed on 'external_npm' macvlan (192.168.0.4) and 'homelab' bridge.
#   - cloudflared: Outbound encrypted CGNAT ingress tunnel on 'homelab' bridge.
# ==============================================================================

services:
  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx
    hostname: nginx
    restart: unless-stopped
    mac_address: 2E:50:8F:7A:C4:12
    environment:
      DISABLE_IPV6: "true"
      DB_SQLITE_FILE: /data/db.sqlite
      TZ: ${TZ:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/nginx/data:/data
      - ${DOCKER_DATA_DIR:?See env.example for default.}/nginx/data/letsencrypt:/etc/letsencrypt
      - ${DOCKER_DATA_DIR:?See env.example for default.}/tandoor/data/mediafiles:/media:ro
    networks:
      homelab:
        aliases:
          - services
      external_npm:
        ipv4_address: ${NPM_IPV4_ADDRESS:?See env.example for default.}
    labels:
      - homepage.group=Administration
      - homepage.name=Proxy Manager
      - homepage.icon=nginx-proxy-manager
      - homepage.href=https://proxy.turing.home
      - homepage.description=Reverse Proxy & SSL

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    hostname: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?See env.example for default.}
    networks:
      - homelab
    labels:
      - homepage.group=Network
      - homepage.name=Cloudflare Tunnel
      - homepage.icon=cloudflare
      - homepage.href=https://one.dash.cloudflare.com/
      - homepage.description=Zero Trust Tunnel

networks:
  external_npm:
    external: true
  homelab:
    external: true
