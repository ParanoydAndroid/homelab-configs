# ==============================================================================
# Stack: Mesh Networking & Tunnels (mesh/compose.yml)
#
# Purpose:
#   Maintains homelab connectivity on the Tailscale mesh network:
#     1. 'tailscale': Primary subnet router advertising 192.168.0.0/24 onto the Tailnet.
#     2. 'vpn': Dedicated WireGuard client connected to PIA for exit node egress.
#     3. 'tailscale-exit': Tailscale daemon attached to 'vpn' network namespace
#        advertising itself as an exit node (--advertise-exit-node).
# ==============================================================================

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homelab
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: homelab
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ROUTES: 192.168.0.0/24
      TS_EXTRA_ARGS: --snat-subnet-routes=true --accept-dns=false
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/tailscale/data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    networks:
      homelab:
      external_npm:
        ipv4_address: ${TAILSCALE_IPV4_ADDRESS:?See env.example for default.}
    labels:
      - homepage.group=Network
      - homepage.name=Tailscale Router
      - homepage.icon=tailscale
      - homepage.href=https://login.tailscale.com/admin/machines
      - homepage.description=Mesh Subnet Router

  vpn:
    image: thrnz/docker-wireguard-pia:latest
    container_name: vpn-bridge-pia
    hostname: vpn-bridge
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    environment:
      USER: ${VPN_USER:?See env.example for default.}
      PASS: ${VPN_PASS:?See env.example for default.}
      LOC: ${PIA_REGION:?See env.example for default.}
      PORT_FORWARDING: 0
      FIREWALL: 1
      FWD_IFACE: tailscale+
      LOCAL_NETWORK: 192.168.0.0/16
      VPNDNS: 9.9.9.9,149.112.112.112
      POST_UP: ip rule add fwmark 0x80000/0xff0000 table 51820 priority 5200 2>/dev/null || true
      POST_RECONNECT: ip rule add fwmark 0x80000/0xff0000 table 51820 priority 5200 2>/dev/null || true
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/vpn-bridge/data/pia:/pia
    networks:
      - homelab

  tailscale-exit:
    image: tailscale/tailscale:latest
    container_name: vpn-bridge-tailscale
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: vpn-bridge
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-exit-node --snat-subnet-routes=true --accept-dns=false --netfilter-mode=off
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/vpn-bridge/data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp
    labels:
      - homepage.group=Network
      - homepage.name=VPN Bridge Exit Node
      - homepage.icon=tailscale
      - homepage.href=https://login.tailscale.com/admin/machines
      - homepage.description=WireGuard Exit Node

networks:
  homelab:
    external: true
  external_npm:
    external: true
