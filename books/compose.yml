# ==============================================================================
# Stack: Books & Reading Automation (books/compose.yml)
#
# Purpose:
#   E-book catalog management (Calibre-Web), commercial book acquisition
#   (Readarr), wireless reading sync (Kindle Send-to-Kindle SMTP and Onyx Boox
#   OPDS), and automated Royal Road web serial tracking (FanFicFare).
#
# Services:
#   - calibre-web: Web reader, OPDS server, and Send-to-Kindle dispatcher (:8083).
#   - readarr: Author monitoring, indexer search, and download manager (:8787).
#   - royalroad-sync: Automated chapter scraper and EPUB builder for web serials.
# ==============================================================================

services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    hostname: calibre-web
    restart: unless-stopped
    environment:
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/calibre-web/data:/config
      - ${MEDIA_DIR:?See env.example for default.}/books/library:/books
      - ${MEDIA_DIR:?See env.example for default.}/books/import:/import
      - ./calibre-web/custom-cont-init.d:/custom-cont-init.d:ro
    networks:
      - homelab
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homelab.backup.sqlite=/config/app.db,/books/metadata.db
      - caddy=books.kamaka.tech
      - caddy.reverse_proxy={{upstreams 8083}}
      - caddy.import=cloudflare_tls lan_only
      - homepage.group=Media
      - homepage.name=Books
      - homepage.icon=calibre-web
      - homepage.href=https://books.kamaka.tech

  bindery:
    image: ghcr.io/vavallee/bindery:latest
    container_name: bindery
    hostname: bindery
    restart: unless-stopped
    user: "${PUID:?See env.example for default.}:${PGID:?See env.example for default.}"
    environment:
      BINDERY_PUID: ${PUID:?See env.example for default.}
      BINDERY_PGID: ${PGID:?See env.example for default.}
      BINDERY_LOG_LEVEL: info
      BINDERY_DOWNLOAD_DIR: /media/downloads
      BINDERY_LIBRARY_DIR: /media/books/library
      TZ: ${TZ:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/bindery/data:/config
      - ${MEDIA_DIR:?See env.example for default.}/books/library:/books
      - ${MEDIA_DIR:?See env.example for default.}:/media
    networks:
      - homelab
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - homelab.backup.sqlite=/config/bindery.db
      - caddy=bindery.kamaka.tech, readarr.kamaka.tech
      - caddy.reverse_proxy={{upstreams 8787}}
      - caddy.import=cloudflare_tls lan_only
      - homepage.group=Media Automation
      - homepage.name=Bindery
      - homepage.icon=readarr
      - homepage.href=https://bindery.kamaka.tech

  royalroad-sync:
    build:
      context: ./fanficfare
      dockerfile: Dockerfile
    image: homelab-fanficfare:latest
    container_name: royalroad-sync
    hostname: royalroad-sync
    restart: unless-stopped
    user: "${PUID:?See env.example for default.}:${PGID:?See env.example for default.}"
    environment:
      TZ: ${TZ:?See env.example for default.}
      POLL_INTERVAL: "14400"
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/royalroad/data:/config
      - ${MEDIA_DIR:?See env.example for default.}/books/import:/import
    networks:
      - homelab
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homelab:
    external: true
