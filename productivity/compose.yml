# ==============================================================================
# Stack: Productivity (productivity/compose.yml)
# Purpose: Mealie recipe and meal planning service.
# ==============================================================================

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    hostname: mealie
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: "true"
      BASE_URL: https://recipes.kamaka.tech
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/mealie/data:/app/data
    networks:
      - homelab
    labels:
      - homelab.stack.priority=40
      - homelab.backup.sqlite=/app/data/mealie.db
      - caddy=recipes.kamaka.tech, recipes.kamakakai.com, mom.kamakakai.com
      - caddy.reverse_proxy={{upstreams 9000}}
      - caddy.import=cloudflare_tls
      - homepage.group=Productivity
      - homepage.name=Mealie Recipes
      - homepage.icon=mealie
      - homepage.href=https://recipes.kamaka.tech
      - homepage.description=Modern Recipe & Meal Planning

networks:
  homelab:
    external: true
