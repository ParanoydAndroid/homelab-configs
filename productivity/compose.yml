# ==============================================================================
# Stack: Productivity Applications & Databases (productivity/compose.yml)
#
# Purpose:
#   Productivity suite providing Mealie recipe management with embedded SQLite
#   and a co-located PostgreSQL database container.
#
# Architecture:
#   - postgresql: Database server with healthcheck (pg_isready).
#   - mealie: Recipe and meal planning server with embedded SQLite engine.
# ==============================================================================

services:
  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    hostname: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recipes
      TZ: ${TZ:?See env.example for default.}
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipes"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - homelab

  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    hostname: mealie
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: "true"
      BASE_URL: https://recipes.kamaka.tech
      PUID: ${PUID:?See env.example for default.}
      PGID: ${PGID:?See env.example for default.}
      TZ: ${TZ:?See env.example for default.}
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
    volumes:
      - ${DOCKER_DATA_DIR:?See env.example for default.}/mealie/data:/app/data
    networks:
      - homelab
    labels:
      - caddy=recipes.kamaka.tech, recipes.kamakakai.com, mom.kamakakai.com
      - caddy.reverse_proxy={{upstreams 9000}}
      - caddy.import=cloudflare_tls
      - homepage.group=Productivity
      - homepage.name=Mealie Recipes
      - homepage.icon=mealie
      - homepage.href=https://recipes.kamaka.tech
      - homepage.description=Modern Recipe & Meal Planning

networks:
  homelab:
    external: true
