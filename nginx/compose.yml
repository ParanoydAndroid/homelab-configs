services:
  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx
    restart: unless-stopped
    mac_address: 2E:50:8F:7A:C4:12
    ports:
      - 80:80
      - 443:443
      - 81:81
    environment:
      - DISABLE_IPV6=true
      - DB_SQLITE_FILE=/data/db.sqlite
    volumes:
      - /volume1/docker/nginx/data/data:/data
      - /volume1/docker/nginx/data/letsencrypt:/etc/letsencrypt
      - /volume1/docker/media:/media:ro
    networks:
      homelab:
        aliases:
          - services
      external_npm:
        ipv4_address: 192.168.0.4

networks:
  external_npm:
    external: true
  homelab:
    external: true